  <circle class="dot-red" cx="20" cy="16" r="5.5" />
  <circle class="dot-yellow" cx="36" cy="16" r="5.5" />
  <circle class="dot-green" cx="52" cy="16" r="5.5" />
  <text class="terminal-title" x="460" y="20" text-anchor="middle">dethanev@dev-machine:~</text>

