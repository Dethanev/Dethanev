<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 10px; }
    .title-bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .terminal-title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; }
    
    /* 人物 ASCII 綠色設定 */
    .ascii { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 8.5px; fill: #39d353; }
    .text { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 11px; }
    
    /* 統一規律的終端機色彩 */
    .user { fill: #56d364; font-weight: bold; }
    .host { fill: #7ee787; font-weight: bold; }
    .divider { fill: #30363d; }
    .section-title { fill: #56d364; font-weight: bold; }
    .key { fill: #e3b341; font-weight: 600; }
    .val { fill: #c9d1d9; }
    .val-highlight { fill: #7ee787; }
    .bullet { fill: #56d364; }
  </style>

  <!-- 卡片外框與背景 -->
  <rect class="bg" width="920" height="460" />
  
  <!-- 頂部視窗控制列 -->
